[pytest]
# The suite runs on 12 workers. Every test is isolated around its own start (the capability map,
# the action registry, the plugin-page list, the expectation store and the in-flight/write locks
# are all reset per test), so the order does not matter and splitting the files across workers
# changes no result: the full run drops from ~14 minutes to ~2.5.
#
# pytest-xdist must be installed wherever this file is used, or pytest refuses the `-n` option
# outright. A focused run costs more than it saves this way — pass `-n 0` for one file or one test.
addopts = -n 12

# pytest-asyncio: the loop scope for async FIXTURES. Pinned rather than left to the plugin's
# changing default, which warns on every run until it is set. No fixture in this suite is async,
# so the value changes no result — it only makes the run silent and the behaviour stable.
asyncio_default_fixture_loop_scope = function
