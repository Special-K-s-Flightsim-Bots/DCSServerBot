# Extraction config for the admin console's OWN gettext domain, "webui".
#
# This is what keeps the catalogs and the templates IN STEP: Babel reads the translatable strings
# straight out of the templates (``{% trans %}``) and the console's Python (``_()``), so there is no
# hand-kept list of strings to fall out of date. Run it from the repository root:
#
#   pybabel extract -F services/webservice/babel.cfg -o /tmp/webui.pot \
#       --project=DCSServerBot --copyright-holder=DCSServerBot --no-wrap .
#   # insert the new entries from /tmp/webui.pot into each catalog BY HAND, in that file's own
#   # style, leaving every existing entry byte-identical
#   pybabel compile -d locale -D webui
#
# Do NOT run `pybabel update` over the catalogs: no --width / --no-wrap invocation reproduces their
# hand-maintained wrapping, so it rewrites the whole file and hides the real change (a handful of
# new strings) in thousands of changed lines.
#
# See services/webservice/I18N.md for the whole workflow.

[jinja2: services/webservice/templates/**.html]
extensions=jinja2.ext.i18n

[python: services/webservice/**.py]
