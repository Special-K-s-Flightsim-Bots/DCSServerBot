schema;package_schema:
  type: seq
  nullable: false
  sequence:
    - type: map
      nullable: false
      mapping:
        name:
          type: str
          required: true
          nullable: false
          range: {min: 1}
          desc: Package name, matching the OvGME folder or zip name.
          example: "Community_A-4E-C"
        version:
          type: text
          required: true
          nullable: false
          desc: Version to install, or 'latest' for the newest one.
          example: "latest"
        source:
          type: str
          enum: ['SavedGames', 'RootFolder']
          required: true
          nullable: false
          desc: Where the package is installed to on the server.
          example: "SavedGames"
        repo:
          type: url
          nullable: false
          desc: GitHub repo to fetch versions from when using 'latest'.
          example: "https://github.com/heclak/community-a4e-c"

schema;default_schema:
  type: map
  nullable: false
  mapping:
    SavedGames:
      type: str
      required: true
      nullable: false
      range: {min: 1}
      func: dir_exists
      desc: Folder holding packages destined for Saved Games.
      example: "%USERPROFILE%\\Documents\\ModManager\\SavedGames"
    RootFolder:
      type: str
      required: true
      nullable: false
      range: {min: 1}
      func: dir_exists
      desc: Folder holding packages destined for the DCS install.
      example: "%USERPROFILE%\\Documents\\ModManager\\RootFolder"
    packages:
      include: 'package_schema'

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    packages:
      include: 'package_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'default_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
