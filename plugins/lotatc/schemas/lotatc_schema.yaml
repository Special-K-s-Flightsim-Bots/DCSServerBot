schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    kick_gci:
      type: bool
      nullable: false
      desc: Kick players from their slot while they are on GCI duty.
      example: "true"
    exemptions:
      type: map
      nullable: false
      desc: Players exempt from the GCI kick rule.
      example: |
        ucid:
          - '11223344556677'
        discord:
          - DCS Admin
      mapping:
        ucid:
          type: seq
          nullable: false
          desc: Player UCIDs exempt from the GCI kick.
          example: |
            - '11223344556677'
          sequence:
            - type: str
              nullable: false
              unique: true
        discord:
          type: seq
          nullable: false
          desc: Discord roles exempt from the GCI kick.
          example: |
            - DCS Admin
          sequence:
            - type: text
              nullable: false

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  chat_commands:
    include: 'chat_commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
