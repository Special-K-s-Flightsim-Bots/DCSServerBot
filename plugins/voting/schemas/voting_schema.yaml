schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  desc: Applies to one instance only.
  mapping:
    regex;(.+):
      include: 'element_schema'

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  desc: Applies to every instance.
  mapping:
    options:
      type: map
      nullable: false
      allowempty: true  # allow other options
      desc: Voting options that players can choose from.
      example: |
        preset:
          choices:
            - Summer
            - Winter
        mission:
          choices:
            - a.miz
        restart:
          run_extensions: true
          shutdown: false
        kick: {}
        tempban:
          duration: 3
      mapping:
        preset:
          include: 'preset_schema'
        mission:
          include: 'mission_schema'
        restart:
          include: 'restart_schema'
        kill:
          include: 'kick_schema'
        tempban:
          include: 'tempban_schema'
    creator:
      type: any
      nullable: false
      func: text_or_list
      desc: Roles allowed to create a voting (all players by default).
      example: |
        - DCS
    voter:
      type: any
      nullable: false
      func: text_or_list
      desc: Roles allowed to vote (all players by default).
      example: |
        - DCS
    mission_time:
      type: int
      range: {min: 1}
      nullable: false
      desc: Minimum mission runtime in minutes before a voting.
      example: "30"
    time:
      type: int
      range: {min: 30}
      nullable: false
      desc: Seconds the voting stays open for players.
      example: "300"
    reminder:
      type: seq
      nullable: false
      desc: Seconds remaining when voters are reminded to vote.
      example: |
        - 180
        - 60
        - 30
      sequence:
        - type: int
          nullable: false
          unique: true
          desc: Seconds left before the voting closes.
          example: "180"
    voting_threshold:
      type: float
      nullable: false
      desc: Share of players that must vote for a result to count.
      example: "0.25"
    voting_rule:
      type: str
      enum: ['majority', 'supermajority', 'unanimous', 'absolute']
      nullable: false
      desc: Rule that decides whether a voting passes.
      example: "majority"
    welcome_message:
      type: str
      nullable: false
      range: {min: 1}
      desc: Chat message shown to players joining the server.
      example: "If you are unhappy, you can {prefix}vote for a change!"
    credits:
      type: int
      nullable: false
      desc: Credit points a player pays to start a voting.
      example: "10"

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'element_schema'
  commands:
    include: 'commands_schema'
  chat_commands:
    include: 'chat_commands_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
