type: map
nullable: false
mapping:
  DEFAULT:
    type: map
    nullable: false
    mapping:
      banlist: {type: str, nullable: false, enum: ['pvp', 'pve', 'both']}
      dcs-ban: {type: bool, nullable: false}
      discord-ban: {type: bool, nullable: false}
      watchlist_only: {type: bool, nullable: false}
      host: {type: str, nullable: false, range: {min: 1}}
      port: {type: int, range: {min: 80, max: 65535}, nullable: false}
      protocol: {type: str, enum: ['http', 'https'], nullable: false}
      use_proxy: {type: bool, nullable: false}
      register: {type: bool, nullable: false}
      upload_errors: {type: bool, nullable: false}
      token: {type: str, nullable: false, range: {min: 1}}
      troublemakers:
        type: map
        nullable: false
        mapping:
          warn: {type: bool, nullable: false}
          warn_threshold: {type: int, nullable: false, range: {min: 3}}
          kick: {type: bool, nullable: false}
          kick_threshold: {type: int, nullable: false, range: {min: 3}}
          message: {type: str, nullable: false, range: {min: 1}}
  commands:
    include: 'commands_schema'
  chat_commands:
    include: 'chat_commands_schema'
