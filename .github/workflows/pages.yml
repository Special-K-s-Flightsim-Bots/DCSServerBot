name: Deploy documentation to Pages

on:
  push:
    branches:
      - development
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'schemas/**'
      - '*/**/schemas/**'
      - 'sql/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Permissions for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the site tooling
        run: pip install -r docs/requirements.txt

      # Assembles the page tree from the in-repo markdown, the component
      # schemas, the command decorators and the SQL, and writes docs/mkdocs.yml.
      - name: Assemble the documentation
        run: python docs/scripts/build_docs.py

      # --strict turns a broken internal link or a missing page into a failure.
      - name: Build the site
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
