      example: |
        provider-priority:
          - aviationweather
          - checkwx
        aviationweather:
          enable: true
      mapping:
        provider-priority:
          type: seq
          nullable: false
          desc: Ordered providers Real Weather fetches weather from.
          example: |
            - aviationweather
            - checkwx
            - custom
          sequence:
            - type: str
              enum: ['aviationweather', 'checkwx', 'custom']
              nullable: false
              unique: true
              desc: Weather data provider name.
              example: "aviationweather"
        aviationweather:
          type: map
          nullable: false
          allowempty: true
          desc: AviationWeather.gov provider settings.
          example: |
            enable: true
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Use AviationWeather.gov as a weather source.
              example: "true"
        checkwx:
          type: map
          nullable: false
          allowempty: true
          desc: CheckWX provider settings.
          example: |
            enable: true
            key: "***"
          mapping:
            enable:
              type: bool
              required: true
              nullable: false
              desc: Use CheckWX as a weather source.
              example: "true"
            key:
              type: str
              required: true
              nullable: false
              range: {min: 1}
              desc: API key of your CheckWX account.
              example: "***"
        custom:
          type: map
          nullable: false
          allowempty: true
          desc: Custom weather provider settings.
          example: |
            enable: false
            file: C:\\weather\\custom.json
          mapping:
            enable:
              type: bool
              required: true
              nullable: false
              desc: Use a custom weather source.
              example: "false"
            file:
              type: str
              nullable: false
              range: {min: 1}
              desc: File the custom weather data is read from.
              example: "C:\\weather\\custom.json"
            override:
              type: bool
              nullable: false
              desc: Let the custom provider override fetched weather.
              example: "false"
        openmeteo:
          type: map
          nullable: false
          allowempty: true
          desc: Open-Meteo provider settings.
          example: |
            enable: true
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Use Open-Meteo as a weather source.
              example: "true"
    options:
      type: map
      nullable: false
      allowempty: true
      desc: Weather, time and date injected into the mission.
      example: |
        time:
          enable: true
          system-time: true
          offset: 0h5m
        weather:
          enable: true
          icao: PGUM
      mapping:
        time:
          type: map
          nullable: false
          allowempty: true
          desc: Mission start time settings.
          example: |
            enable: true
            system-time: true
            offset: 0h5m
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Shift the mission start time.
              example: "true"
            system-time:
              type: bool
              nullable: false
              desc: Use the current system time as the base.
              example: "true"
            offset:
              type: str
              pattern: '^[+-]?(?:0|(?:\d+(?:\.\d+)?h(?:\d+m)?))$'
              nullable: false
              range: {min: 1}
              desc: Offset applied to the mission time, e.g. 0h5m.
              example: "0h5m"
        date:
          type: map
          nullable: false
          allowempty: true
          desc: Mission date settings.
          example: |
            enable: true
            system-date: true
            offset: 0
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Shift the mission date.
              example: "true"
            system-date:
              type: bool
              nullable: false
              desc: Use the current system date as the base.
              example: "true"
            offset:
              type: str
              pattern: '^[+-]?(?:0|(?:(?:\d+y)?(?:\d+m)?(?:\d+d)?))$'
              nullable: false
              range: {min: 1}
              desc: Offset applied to the mission date, e.g. 10d.
              example: "10d"
        weather:
          type: map
          nullable: false
          allowempty: true
          desc: Weather injected into the mission by Real Weather.
          example: |
            enable: true
            icao: PGUM
            runway-elevation: 160
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Inject real-world weather into the mission.
              example: "true"
            icao:
              type: str
              pattern: '^[A-Z]{4}$'
              nullable: false
              range: {min: 1}
              desc: Fixed ICAO station the weather is taken from.
              example: "PGUM"
            icao-list:
              type: seq
              nullable: false
              desc: ICAO stations to pick weather from; exclusive with icao.
              example: |
                - EDDF
                - EDDM
              sequence:
                - type: str
                  pattern: '^[A-Z]{4}$'
                  nullable: false
                  unique: true
                  desc: ICAO station code.
                  example: "EDDF"
            runway-elevation:
              type: int
              range: {min: 0}
              nullable: false
              desc: Runway elevation in meters, used for the QNH.
              example: "160"
            wind:
              type: map
              nullable: false
              allowempty: true
              desc: Wind generation limits.
              example: |
                enable: true
                minimum: 0
                maximum: 50
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate wind for the mission.
                  example: "true"
                minimum:
                  type: int
                  range: {min: 0}
                  nullable: false
                  desc: Minimum wind speed in meters per second.
                  example: "0"
                maximum:
                  type: int
                  range: {max: 50}
                  nullable: false
                  desc: Maximum wind speed in meters per second.
                  example: "50"
                gust-minimum:
                  type: int
                  range: {min: 0}
                  nullable: false
                  desc: Minimum gust speed in meters per second.
                  example: "0"
                gust-maximum:
                  type: int
                  range: {max: 50}
                  nullable: false
                  desc: Maximum gust speed in meters per second.
                  example: "50"
                scale-factor:
                  type: float
                  range: {min: 0.1}
                  nullable: false
                  desc: Multiplier applied to the generated wind speed.
                  example: "1.0"
                direction-minimum:
                  type: int
                  range: {min: 0, max: 359}
                  nullable: false
                  desc: Lowest wind direction in degrees.
                  example: "0"
                direction-maximum:
                  type: int
                  range: {min: 0, max: 359}
                  nullable: false
                  desc: Highest wind direction in degrees.
                  example: "359"
                stability:
                  type: float
                  nullable: false
                  desc: Wind stability factor between 0.0 and 1.0.
                  example: "0.143"
                fixed-reference:
                  type: bool
                  nullable: false
                  desc: Use a fixed direction reference instead of random.
                  example: "false"
            clouds:
              type: map
              nullable: false
              allowempty: true
              desc: Cloud layer generation.
              example: |
                enable: true
                presets:
                  default: Preset7
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate clouds for the mission.
                  example: "true"
                fallback-to-legacy:
                  type: bool
                  nullable: false
                  desc: Fall back to the legacy cloud model if needed.
                  example: "true"
                base:
                  type: map
                  nullable: false
                  allowempty: true
                  desc: Cloud base altitude limits.
                  example: |
                    minimum: 0
                    maximum: 15000
                  mapping:
                    minimum:
                      type: int
                      range: {min: 0}
                      nullable: false
                      desc: Minimum cloud base altitude in meters.
                      example: "0"
                    maximum:
                      type: int
                      range: {max: 15000}
                      nullable: false
                      desc: Maximum cloud base altitude in meters.
                      example: "15000"
                presets:
                  type: map
                  nullable: false
                  allowempty: true
                  desc: Cloud preset selection.
                  example: |
                    default: Preset7
                  mapping:
                    default:
                      type: str
                      nullable: false
                      desc: Default cloud preset used by Real Weather.
                      example: "Preset7"
                    disallowed:
                      type: seq
                      nullable: false
                      desc: Cloud presets Real Weather must not pick.
                      example: |
                        - Preset1
                        - Preset2
                      sequence:
                        - type: str
                          nullable: false
                          range: {min: 1}
                          unique: true
                          desc: Cloud preset name.
                          example: "Preset1"
                custom:
                  type: map
                  allowempty: true
                  nullable: false
                  desc: Custom cloud density settings.
                  example: |
                    enable: true
                    density-maximum: 10
                  mapping:
                    enable:
                      type: bool
                      nullable: false
                      desc: Use custom cloud density settings.
                      example: "true"
                    allow-precipitation:
                      type: bool
                      nullable: false
                      desc: Allow precipitation with custom clouds.
                      example: "false"
                    density-minimum:
                      type: int
                      range: {min: 0}
                      nullable: false
                      desc: Minimum cloud density (0-10).
                      example: "0"
                    density-maximum:
                      type: int
                      range: {min: 0, max: 10}
                      nullable: false
                      desc: Maximum cloud density (0-10).
                      example: "10"
            fog:
              type: map
              nullable: false
              allowempty: true
              desc: Fog generation.
              example: |
                enable: true
                mode: auto
                visibility-maximum: 6000
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate fog for the mission.
                  example: "true"
                mode:
                  type: str
                  enum: ["auto", "manual", "legacy"]
                  nullable: false
                  desc: Fog generation mode.
                  example: "auto"
                thickness-minimum:
                  type: int
                  range: {min: 0}
                  nullable: false
                  desc: Minimum fog thickness in meters.
                  example: "0"
                thickness-maximum:
                  type: int
                  range: {min: 0, max: 1000}
                  nullable: false
                  desc: Maximum fog thickness in meters.
                  example: "1000"
                visibility-minimum:
                  type: int
                  range: {min: 0}
                  nullable: false
                  desc: Minimum visibility in meters with fog.
                  example: "0"
                visibility-maximum:
                  type: int
                  range: {max: 6000}
                  nullable: false
                  desc: Maximum visibility in meters with fog.
                  example: "6000"
            dust:
              type: map
              allowempty: true
              nullable: false
              desc: Dust generation.
              example: |
                enable: true
                visibility-maximum: 3000
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate dust for the mission.
                  example: "true"
                visibility-minimum:
                  type: int
                  range: {min: 300}
                  nullable: false
                  desc: Minimum visibility in meters with dust.
                  example: "300"
                visibility-maximum:
                  type: int
                  range: {max: 3000}
                  nullable: false
                  desc: Maximum visibility in meters with dust.
                  example: "3000"
            temperature:
              type: map
              nullable: false
              allowempty: true
              desc: Temperature generation.
              example: |
                enable: true
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate temperature for the mission.
                  example: "true"
            pressure:
              type: map
              nullable: false
              allowempty: true
              desc: Air pressure generation.
              example: |
                enable: true
              mapping:
                enable:
                  type: bool
                  nullable: false
                  desc: Generate air pressure for the mission.
                  example: "true"
