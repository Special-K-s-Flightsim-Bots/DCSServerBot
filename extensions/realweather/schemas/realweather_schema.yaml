schema;node_realweather_schema:
  type: map
  nullable: false
  allowempty: true
  mapping:
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: Name of the RealWeather extension in status embeds.
      example: "RealWeather"
    installation:
      type: str
      required: true
      nullable: false
      range: {min: 1}
      func: dir_exists
      desc: Directory where DCS Real Weather is installed.
      example: "%USERPROFILE%\\Documents\\realweather_v2.5.0"
    autoupdate:
      type: bool
      nullable: false
      desc: Update DCS Real Weather automatically on new releases.
      example: "true"
    ignore_errors:
      type: bool
      nullable: false
      desc: Log Real Weather errors and continue instead of failing.
      example: "false"
    realweather:
      type: map
      nullable: false
      allowempty: true
      desc: Real Weather TOML overrides and log settings.
      example: |
        log:
          enable: true
          file: realweather.log
        mission:
          brief:
            add-metar: true
      mapping:
        log:
          type: map
          nullable: false
          allowempty: true
          desc: Logging of the DCS Real Weather process.
          example: |
            enable: true
            file: realweather.log
            max-size: 1048576
            level: info
          mapping:
            enable:
              type: bool
              nullable: false
              enum: [true]
              desc: Enable Real Weather logging (must stay true).
              example: "true"
            file:
              type: str
              nullable: false
              pattern: "realweather.log"
              desc: Name of the Real Weather log file.
              example: "realweather.log"
            max-size:
              type: int
              nullable: false
              desc: Maximum log file size in bytes before rotation.
              example: "1048576"
            max-backups:
              type: int
              nullable: false
              desc: Number of rotated log files to keep.
              example: "5"
            max-age:
              type: int
              nullable: false
              desc: Maximum age of a log file in days.
              example: "30"
            compress:
              type: bool
              nullable: false
              desc: Compress rotated log files.
              example: "true"
            level:
              type: str
              enum: ['debug', 'info', 'warn', 'error']
              nullable: false
              desc: Verbosity of the Real Weather log.
              example: "info"
        mission:
          type: map
          nullable: false
          allowempty: true
          desc: Real Weather mission processing options.
          example: |
            brief:
              add-metar: true
              remarks: Remarks:
          mapping:
            brief:
              type: map
              nullable: false
              allowempty: true
              desc: Weather briefing injected into the mission.
              example: |
                add-metar: true
                remarks: Remarks:
              mapping:
                add-metar:
                  type: bool
                  nullable: false
                  desc: Add the current METAR to the mission briefing.
                  example: "true"
                insert-key:
                  type: str
                  nullable: false
                  range: {min: 1}
                  desc: Briefing key the METAR text is inserted into.
                  example: "WeatherBrief"
                remarks:
                  type: str
                  nullable: false
                  desc: Text appended after the METAR in the briefing.
                  example: "Remarks:"
    api:
      type: map
      nullable: false
      allowempty: true
      desc: Weather data providers and the order they are tried in.
      example: |
        provider-priority:
          - aviationweather
          - checkwx
        aviationweather:
          enable: true
      mapping:
        provider-priority:
          type: seq
          nullable: false
          desc: Ordered providers Real Weather fetches weather from.
          example: |
            - aviationweather
            - checkwx
            - custom
          sequence:
            - type: str
              enum: ['aviationweather', 'checkwx', 'custom']
              nullable: false
              unique: true
              desc: Weather data provider name.
              example: "aviationweather"
        aviationweather:
          type: map
          nullable: false
          allowempty: true
          desc: AviationWeather.gov provider settings.
          example: |
            enable: true
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Use AviationWeather.gov as a weather source.
              example: "true"
        checkwx:
          type: map
          nullable: false
          allowempty: true
          desc: CheckWX provider settings.
          example: |
            enable: true
            key: "***"
          mapping:
            enable:
              type: bool
              required: true
              nullable: false
              desc: Use CheckWX as a weather source.
              example: "true"
            key:
              type: str
              required: true
              nullable: false
              range: {min: 1}
              desc: API key of your CheckWX account.
              example: "***"
        custom:
          type: map
          nullable: false
          allowempty: true
          desc: Custom weather provider settings.
          example: |
            enable: false
            file: C:\\weather\\custom.json
          mapping:
            enable:
              type: bool
              required: true
              nullable: false
              desc: Use a custom weather source.
              example: "false"
            file:
              type: str
              nullable: false
              range: {min: 1}
              desc: File the custom weather data is read from.
              example: "C:\\weather\\custom.json"
            override:
              type: bool
              nullable: false
              desc: Let the custom provider override fetched weather.
              example: "false"
        openmeteo:
          type: map
          nullable: false
          allowempty: true
          desc: Open-Meteo provider settings.
          example: |
            enable: true
          mapping:
            enable:
              type: bool
              nullable: false
              desc: Use Open-Meteo as a weather source.
              example: "true"

schema;instance_realweather_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Enable the RealWeather extension for this instance.
      example: "true"
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: Name of the RealWeather extension in status embeds.
      example: "RealWeather"
    debug:
      type: bool
      nullable: false
      desc: Write the Real Weather output to the bot log.
      example: "false"
    ignore_errors:
      type: bool
      nullable: false
      desc: Log Real Weather errors and continue instead of failing.
      example: "false"
    terrains:
      type: map
      nullable: false
      allowempty: true
      desc: Per-terrain option overrides, keyed by the DCS map name.
      example: |
        Caucasus:
          options:
            weather:
              icao: UGKO
        Syria:
          options:
            weather:
              icao: OSDI
      mapping:
        regex;(Caucasus|Syria|PersianGulf|SinaiMap|TheChannel|Nevada|Normandy|MarianaIslands|Falklands|Kola|Afghanistan|Iraq|GermanyCW):
          include: 'instance_realweather_schema'
    realweather:
      type: map
      allowempty: true
      nullable: false
      desc: Real Weather TOML overrides and log settings.
      example: |
        log:
          enable: true
          file: realweather.log
      mapping:
        log:
