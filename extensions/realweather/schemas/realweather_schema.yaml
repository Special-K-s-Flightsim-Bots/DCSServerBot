              desc: Maximum age of a log file in days.
              example: "30"
            compress:
              type: bool
              nullable: false
              desc: Compress rotated log files.
              example: "true"
            level:
              type: str
              enum: ['debug', 'info', 'warn', 'error']
              nullable: false
              desc: Verbosity of the Real Weather log.
              example: "info"
        mission:
          type: map
          nullable: false
          allowempty: true
          desc: Real Weather mission processing options.
          example: |
            brief:
              add-metar: true
              remarks: Remarks:
          mapping:
            brief:
              type: map
              desc: Weather briefing injected into the mission.
              example: |
                add-metar: true
                remarks: Remarks:
              mapping:
                add-metar:
                  type: bool
                  nullable: false
                  desc: Add the current METAR to the mission briefing.
                  example: "true"
                insert-key:
                  type: str
                  nullable: false
                  range: {min: 1}
                  desc: Briefing key the METAR text is inserted into.
