schema;dsmc_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the DSMC persistence extension is enabled.
      example: "true"
    autoupdate:
      type: bool
      nullable: false
      desc: Auto-update DSMC to the latest version from GitHub.
      example: "false"
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: Extension name shown in the server status embed.
      example: "DSMC"
