schema;dks_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the DKS exporter is installed on this instance.
      example: "true"
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: The name shown for the extension.
      example: "DKS"
    hidden:
      type: bool
      nullable: false
      desc: Hide the extension in the server status.
      example: "false"
    autoupdate:
      type: bool
      nullable: false
      desc: Not used. The exporter updates itself (signed releases). Kept so older configurations stay valid.
      example: "false"
    downloadUrl:
      type: str
      nullable: false
      pattern: '^https://'
      desc: Where the exporter is downloaded from. Defaults to https://www.digitalkneeboardsimulator.com.
      example: "https://www.digitalkneeboardsimulator.com"
    key:
      type: str
      nullable: false
      range: {min: 1}
      desc: The install code from your server's page in DKS.
      example: "dks1.eyJka3NVcmwiOi..."
    dksUrl:
      type: str
      nullable: false
      range: {min: 1}
      desc: The DKS address. Defaults to https://www.digitalkneeboardsimulator.com.
      example: "https://www.digitalkneeboardsimulator.com"
    keyId:
      type: str
      nullable: false
      range: {min: 1}
      desc: The exporter key id (instead of key, e.g. from Config\DKS-Telemetry.cfg).
      example: "dkt_0123456789ab"
    secret:
      type: str
      nullable: false
      range: {min: 1}
      desc: The exporter secret from your server's page in DKS.
      example: "..."
    ownerId:
      type: str
      nullable: false
      range: {min: 1}
      desc: The server id from your server's page in DKS.
      example: "..."
