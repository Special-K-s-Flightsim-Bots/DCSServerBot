schema;settings_map:
  type: map
  nullable: false
  mapping:
    regex;(^(0?[0-9]|1[0-9]|2[0-4])(:[0-5][0-9])?-(0?[0-9]|1[0-9]|2[0-4])(:?[0-5][0-9])?$):
      type: any
      nullable: false
      func: str_or_list
      enum: ['settings_list']

schema;settings_list:
  type: seq
  nullable: false
  sequence:
    - type: any
      nullable: false
      func: str_or_list

schema;settings:
  type: any
  nullable: false
  func: seq_or_map
  enum: ['settings_list', 'settings_map']

schema;mizedit_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the MizEdit extension is enabled on this instance.
      example: "true"
    debug:
      type: bool
      nullable: false
      desc: Log the preset modifications applied to each mission.
      example: "false"
    presets:
      type: any
      nullable: false
      func: str_or_list
      desc: Preset file(s) that hold the mission modification presets.
      example: |
        - config/presets.yaml
        - config/presets_weather.yaml
    timezone:
      type: str
      nullable: false
      range: {min: 1}
      desc: Timezone used when evaluating time-range keys in settings.
      example: "UTC"
    settings:
      type: any
      include: 'settings'
    terrains:
      type: map
      nullable: false
      desc: Map-specific preset selections keyed by terrain name.
      example: |
        Caucasus:
          settings:
            - Winter, Morning, Slight Breeze, Halo
      mapping:
        regex;(Caucasus|Syria|PersianGulf|SinaiMap|TheChannel|Nevada|Normandy|MarianaIslands|Falklands|Kola|Afghanistan|Iraq|GermanyCW):
          type: map
          nullable: false
          mapping:
            settings:
              include: 'settings'
    filter:
      type: str
      nullable: false
      range: {min: 1}
      desc: Glob filter limiting MizEdit to matching mission names.
      example: "MyFancy*"
