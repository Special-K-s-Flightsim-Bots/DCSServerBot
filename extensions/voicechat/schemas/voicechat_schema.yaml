schema;voicechat_schema:
  type: map
  nullable: false
  mapping:
    enabled:
      type: bool
      nullable: false
      desc: Whether the built-in DCS Voice Chat server setting is enabled.
      example: "true"
    name:
      type: str
      nullable: false
      range: {min: 1}
      desc: Extension name shown in the server status embed.
      example: "DCS Voice Chat"
